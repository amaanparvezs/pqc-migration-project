name: CBOM scan of indirection fixture

on:
  workflow_dispatch:

jobs:
  cbom-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Compile the fixture
        run: |
          javac --release 11 -d fixtures/indirection/build $(find fixtures/indirection/src -name '*.java')
          find fixtures/indirection/build -name '*.class'

      - name: Create CBOM
        uses: cbomkit/cbomkit-action@v2.3.0
        id: cbom
        env:
          CBOMKIT_LANGUAGES: java

      - name: Upload CBOM
        uses: actions/upload-artifact@v4
        with:
          name: CBOM-fixture-indirection
          path: ${{ steps.cbom.outputs.pattern }}
          if-no-files-found: warn