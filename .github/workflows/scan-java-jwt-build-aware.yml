name: Build-aware CBOM scan of java-jwt

on:
  workflow_dispatch:

jobs:
  cbom-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out java-jwt at the trial commit
        uses: actions/checkout@v5
        with:
          repository: auth0/java-jwt
          ref: 29f252b2d6fea74df6576803d5fce5f6d6799cf3

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build with Gradle
        run: ./gradlew assemble --no-daemon

      - name: Copy dependency jars into the workspace
        run: |
          mkdir -p deps
          find ~/.gradle/caches/modules-2/files-2.1 -name '*.jar' -exec cp {} deps/ \;
          ls deps

      - name: Create CBOM
        uses: cbomkit/cbomkit-action@v2.3.0
        id: cbom
        env:
          CBOMKIT_LANGUAGES: java

      - name: Upload CBOM
        uses: actions/upload-artifact@v4
        with:
          name: CBOM-java-jwt-build-aware
          path: ${{ steps.cbom.outputs.pattern }}
          if-no-files-found: warn